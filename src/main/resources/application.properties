spring.application.name=budget-ai-api

# Chave da OpenAI vem de variavel de ambiente (nunca coloque a chave no codigo)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt

# Banco em memoria (H2) para rodar sem Docker
spring.datasource.url=jdbc:h2:mem:budgetdb
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Limite de tamanho de audio
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
